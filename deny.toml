# cargo-deny configuration for Squid-CRM
# AGPL-3.0 project; allows AGPL, MIT, Apache-2.0, BSD, ISC, and similar
# permissive licenses. Restricts proprietary/copyleft-beyond-AGPL licenses.

[version]
version = 1

[[lint]]
kind = "licenses"
license = { allow = { mit = true, apache = true, bsd = true, isc = true, "0bsd" = true, mpl = true, lgpl = true, agpl = true, unicc = true, postgresql = true, zlib = true, multilicense = true } }

[[lint]]
kind = "vulnerabilities"

[advisories]
db = { path = "sec-advisories.db", url = "https://github.com/rustsec/advisory-db" }
