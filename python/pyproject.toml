[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "squid-crm"
version = "0.3.0"
description = "Python client for the Squid CRM REST and GraphQL APIs"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-only"
authors = [{ name = "Squid-CRM contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/Mullassery/Squid-CRM"

[tool.setuptools.packages.find]
where = ["src"]
