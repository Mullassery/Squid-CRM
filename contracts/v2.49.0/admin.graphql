  adminPanelTopWorkspaces(searchTerm: String = ""): [AdminPanelTopWorkspace!]!
  getServerAdmins: [ServerAdmin!]!
  getConfigVariablesGrouped: ConfigVariables!
  getSystemHealthStatus: SystemHealth!
  getIndicatorHealthStatus(indicatorId: HealthIndicatorId!): AdminPanelHealthServiceData!
  getQueueMetrics(queueName: String!, timeRange: QueueMetricsTimeRange = OneHour): QueueMetricsData!
  versionInfo: VersionInfo!
  getAdminAiModels: AdminAiModels!
  getDatabaseConfigVariable(key: String!): ConfigVariable!
  getQueueJobs(queueName: String!, state: JobState!, limit: Int = 50, offset: Int = 0): QueueJobsResponse!
  findAllApplicationRegistrations(limit: Int = 25, offset: Int = 0, searchTerm: String, isPreInstalledOnly: Boolean, sourceTypes: [ApplicationRegistrationSourceType!], isListed: Boolean, isConfigured: Boolean): PaginatedApplicationRegistrations!
  findAdminApplicationRegistrationClaims(applicationRegistrationId: String!): [AdminApplicationRegistrationClaim!]!
  getAdminAiUsageByWorkspace(periodStart: DateTime, periodEnd: DateTime): [UsageBreakdownItem!]!
  getMaintenanceMode: MaintenanceMode
  workspaceLookupAdminPanel(workspaceId: UUID!): UserLookup!
  workspaceBillingAdminPanel(workspaceId: UUID!): AdminPanelWorkspaceBilling
  getAdminWorkspaceChatThreads(workspaceId: UUID!): [AdminWorkspaceChatThread!]!
  getAdminChatThreadMessages(workspaceId: UUID!, threadId: UUID!): AdminChatThreadMessages!
  findOneAdminApplicationRegistration(id: String!): ApplicationRegistration!
  findAdminApplicationRegistrationVariables(applicationRegistrationId: String!): [ApplicationRegistrationVariable!]!
  findAdminApplicationRegistrationStats(id: String!, periodStart: DateTime, periodEnd: DateTime): ApplicationRegistrationStats!
  findAdminApplicationRegistrationInstalledWorkspaces(input: FindApplicationRegistrationInstalledWorkspacesInput!): ApplicationRegistrationInstalledWorkspaces!
  getInstanceAndAllWorkspacesUpgradeStatus: InstanceAndAllWorkspacesUpgradeStatus!
  getUpgradeStatus(workspaceIds: [UUID!]!): [WorkspaceUpgradeStatus!]!
  getSigningKeys: SigningKeysAdminPanelDTO!
  getCustomAiProviderAccess: CustomAiProviderAccessDTO!
  getAiProviders: JSON!
  getModelsDevProviders: [ModelsDevProviderSuggestion!]!
  getModelsDevSuggestions(providerType: String!): [ModelsDevModelSuggestion!]!
  workspaceUsageLimits(workspaceId: UUID!): AdminPanelWorkspaceUsageLimits!
}

input FindApplicationRegistrationInstalledWorkspacesInput {
  id: String!
  limit: Int! = 10
  offset: Int! = 0
  searchTerm: String
}

type Mutation {
  updateServerAdminAccess(userId: UUID!, canAccessFullAdminPanel: Boolean, canImpersonate: Boolean, otp: String): ServerAdmin!
  generateTwoFactorAuthenticationRecoveryCodeAsServerAdmin(otp: String, userId: UUID!, workspaceId: UUID!): TwoFactorAuthenticationRecoveryCode!
  updateWorkspaceFeatureFlag(workspaceId: UUID!, featureFlag: String!, value: Boolean!): Boolean!
  setAdminAiModelEnabled(modelId: String!, enabled: Boolean!): Boolean!
  setAdminAiModelsEnabled(modelIds: [String!]!, enabled: Boolean!): Boolean!
  setAdminDefaultAiModel(tier: AiModelTier!, modelId: String!): Boolean!
  createDatabaseConfigVariable(key: String!, value: JSON!): Boolean!
  updateDatabaseConfigVariable(key: String!, value: JSON!): Boolean!
  deleteDatabaseConfigVariable(key: String!): Boolean!
  retryJobs(queueName: String!, jobIds: [String!]!): RetryJobsResponse!
  deleteJobs(queueName: String!, jobIds: [String!]!): DeleteJobsResponse!
  syncMarketplaceCatalog: Boolean!
  updateAdminApplicationRegistration(input: AdminUpdateApplicationRegistrationInput!): ApplicationRegistration!
  setMaintenanceMode(startAt: DateTime!, endAt: DateTime!, link: String): Boolean!
  clearMaintenanceMode: Boolean!
  grantWorkspaceCredits(workspaceId: UUID!, amount: Float!, type: BillingCreditGrantType!, reason: String, expiresInDays: Int, clientOperationId: UUID!): AdminPanelWorkspaceCreditGrant!
  revokeWorkspaceCreditGrant(workspaceId: UUID!, creditGrantId: UUID!): AdminPanelWorkspaceCreditGrant!
  updateAdminApplicationRegistrationVariable(input: UpdateApplicationRegistrationVariableInput!): ApplicationRegistrationVariable!
  refreshUpgradeStatus: InstanceAndAllWorkspacesUpgradeStatus!
  revokeSigningKey(id: UUID!): SigningKeyDTO!
  addAiProvider(providerName: String!, providerConfig: JSON!): Boolean!
  removeAiProvider(providerName: String!): Boolean!
  addModelToProvider(providerName: String!, modelConfig: JSON!): Boolean!
  removeModelFromProvider(providerName: String!, modelName: String!): Boolean!
  createWorkspaceUsageLimit(workspaceId: UUID!, payload: CreateUsageLimitInput!): AdminPanelUsageLimit!
  updateWorkspaceUsageLimit(workspaceId: UUID!, payload: UpdateUsageLimitInput!): AdminPanelUsageLimit!
  deleteWorkspaceUsageLimit(workspaceId: UUID!, usageLimitId: UUID!): Boolean!
}

