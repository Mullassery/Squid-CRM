name: squid-crm

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PG_DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_DATABASE_NAME:-squid}
    ports:
      - "${PG_DATABASE_PORT:-5432}:5432"
    volumes:
      - squid-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-postgres}@db:5432/${PG_DATABASE_NAME:-squid}
      APP_SECRET: ${APP_SECRET:?APP_SECRET must be set}
      BIND_ADDR: 0.0.0.0:3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      REDIS_URL: redis://redis:6379
    ports:
      - "${SERVER_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://server:3000
      PORT: 3000
    ports:
      - "${WEB_PORT:-3001}:3000"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  squid-db:
